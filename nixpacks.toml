# Railway build config. No Dockerfile: Railway's Nixpacks builder reads this and assembles
# the image itself.
#
# What has to be present at runtime is not negotiable — the pipeline shells out to all of it:
#   git       S1 clones the repository under assessment
#   gitleaks  S6 fails a run outright when it is missing, rather than skipping the scan
#   python3   S6 verifies generated Python packages, each in its own venv
#   claude    every agent stage runs `claude -p --output-format json`
#
# `GET /api/health` checks for exactly these and returns 503 if any is missing, so a build
# that gets this wrong fails at the door rather than ten minutes into a paid run.

[phases.setup]
nixPkgs = ['...', 'git', 'gitleaks', 'python3']

[phases.install]
# An unqualified `npm install -g` put the CLI somewhere the runtime PATH never reached, and
# the first sign of it was `claude: false` from the live health check. `--prefix /usr/local`
# names the destination, and running the binary by absolute path in the same step means a
# build that gets this wrong fails here rather than four minutes into a healthcheck.
#
# Not a workspace dependency: the CLI requires Node >= 22 and this repo's floor is 20, so
# depending on it would fail `pnpm install` for every contributor on Node 20 — which is what
# CI caught. CLAUDE.md's contract is that `claude` is on PATH, and this satisfies it.
cmds = ['...', 'npm install -g --prefix /usr/local @anthropic-ai/claude-code', '/usr/local/bin/claude --version']

[phases.build]
# One command: `web`'s own build script builds core first, so a clean checkout works whatever
# command the platform decides to run. Railway ran `pnpm --filter web build` on its own and
# the build failed on `Cannot find module 'core'` — core's types live in dist/, which does
# not exist until it is built.
cmds = ['pnpm --filter web build']

[start]
cmd = 'pnpm --filter web start'

[variables]
NODE_ENV = 'production'
# Run directories go on the mounted volume: the run id /api/map hands the browser has to
# still resolve when /api/generate asks for it.
QUARRY_WORK_DIR = '/data/work'
